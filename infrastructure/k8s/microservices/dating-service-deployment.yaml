apiVersion: apps/v1
kind: Deployment
metadata:
  name: dating-service
  labels:
    app: dating-service
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: dating-service
  template:
    metadata:
      labels:
        app: dating-service
    spec:
      containers:
      - name: dating-service
        image: trungtamtrochoi/dating-service:latest
        ports:
        - containerPort: 3001
          name: http
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "dating_db"
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: dating-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dating-secrets
              key: db-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: dating-secrets
              key: jwt-secret
        - name: AUTH_SERVICE_HOST
          value: "auth-service"
        - name: AUTH_SERVICE_PORT
          value: "50051"
        - name: REDIS_HOST
          value: "redis-service"
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq-service:5672"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dating-service
spec:
  selector:
    app: dating-service
  ports:
  - port: 3001
    targetPort: 3001
    name: http
  type: ClusterIP

