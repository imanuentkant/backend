version: '3.8'

services:
  # ============================================
  # Infrastructure
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: dating_db,property_db,auth_db,message_db,payment_db,vehicle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Kafka Infrastructure
  # ============================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - app-network

  # ============================================
  # Microservices
  # ============================================

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      API_ACCESS_TOKEN_SECRET: your-secret-key-change-in-production
      DATING_SERVICE_URL: http://dating-service:3001
      PROPERTY_SERVICE_URL: http://property-service:3002
      VEHICLE_SERVICE_URL: http://vehicle-service:3003
      MESSAGE_SERVICE_URL: http://message-service:3006
      AUTH_SERVICE_URL: http://auth-service:3007
      PAYMENT_SERVICE_URL: http://payment-service:3008
    depends_on:
      - dating-service
      - property-service
      - auth-service
    networks:
      - app-network
    restart: unless-stopped

  dating-service:
    build:
      context: ./apps/microservices/dating-service
      dockerfile: Dockerfile
    container_name: dating-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: dating_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: dating-service
      KAFKA_GROUP_ID: dating-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  property-service:
    build:
      context: ./apps/microservices/property-service
      dockerfile: Dockerfile
    container_name: property-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: property_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: property-service
      KAFKA_GROUP_ID: property-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  vehicle-service:
    build:
      context: ./apps/microservices/vehicle-service
      dockerfile: Dockerfile
    container_name: vehicle-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: vehicle_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: vehicle-service
      KAFKA_GROUP_ID: vehicle-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  message-service:
    build:
      context: ./apps/microservices/message-service
      dockerfile: Dockerfile
    container_name: message-service
    ports:
      - "3006:3006"
    environment:
      PORT: 3006
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: message_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: message-service
      KAFKA_GROUP_ID: message-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./apps/microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3007:3007"
    environment:
      PORT: 3007
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: auth_db
      API_ACCESS_TOKEN_SECRET: your-secret-key-change-in-production
      API_ACCESS_TOKEN_EXPIRATION: 1d
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: auth-service
      KAFKA_GROUP_ID: auth-service-group
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  payment-service:
    build:
      context: ./apps/microservices/payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "3008:3008"
    environment:
      PORT: 3008
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: payment_db
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: payment-service
      KAFKA_GROUP_ID: payment-service-group
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge

